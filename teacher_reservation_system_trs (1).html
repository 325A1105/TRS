<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Reservation System (TRS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons CDN -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        primaryHover: '#4338CA', // Indigo 700
                        secondary: '#10B981', // Emerald 500
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; color: #334155; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'trs-app';
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        let firebaseConfig = null;
        try {
            if (rawConfig) firebaseConfig = JSON.parse(rawConfig);
        } catch(e) {}

        let db = null;
        let auth = null;
        let isFirebaseAvailable = false;

        if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "demo-key" && firebaseConfig.projectId !== "demo-project") {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseAvailable = true;
            } catch(e) {
                console.warn("[Firebase Initializer] Falling back to LocalStorage mode:", e);
            }
        }

        const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('trs_sync_channel') : null;

        const localListeners = {};
        const triggerLocalUpdate = (colName) => {
            const data = JSON.parse(localStorage.getItem(`trs_data_${colName}`) || '[]');
            if (localListeners[colName]) {
                localListeners[colName].forEach(cb => {
                    try { cb(data); } catch(err) { console.error(err); }
                });
            }
        };

        if (syncChannel) {
            syncChannel.onmessage = (e) => {
                if (e.data && e.data.colName) {
                    triggerLocalUpdate(e.data.colName);
                }
            };
        }

        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('trs_data_')) {
                const colName = e.key.replace('trs_data_', '');
                triggerLocalUpdate(colName);
            }
        });

        const initDefaultData = () => {
            if (!localStorage.getItem('trs_data_teachers')) {
                const teachers = [
                    { id: 'teacher_1', name: '山田先生' },
                    { id: 'teacher_2', name: '佐藤先生' },
                    { id: 'teacher_3', name: '鈴木先生' }
                ];
                localStorage.setItem('trs_data_teachers', JSON.stringify(teachers));
            }

            if (!localStorage.getItem('trs_data_slots')) {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const dateStr = tomorrow.toISOString().split('T')[0];
                const slots = [
                    { id: 'slot_1', teacher: '山田先生', date: dateStr, time: '10:00 - 11:00', available: true },
                    { id: 'slot_2', teacher: '佐藤先生', date: dateStr, time: '13:00 - 14:00', available: true },
                    { id: 'slot_3', teacher: '鈴木先生', date: dateStr, time: '15:00 - 16:00', available: true }
                ];
                localStorage.setItem('trs_data_slots', JSON.stringify(slots));
            }

            if (!localStorage.getItem('trs_data_qas')) {
                const qas = [
                    {
                        id: 'qa_1',
                        title: '期末課題の提出期限および提出方法について',
                        category: '授業',
                        question: '期末課題のプログラムについて、提出フォーマットと期限を教えてください。',
                        answer: '次回講義の前日23:59までにポータルサイトの課題提出欄へZIP形式でアップロードしてください。',
                        teacher: '山田先生',
                        date: '2026-10-10',
                        likes: 5
                    },
                    {
                        id: 'qa_2',
                        title: '基本情報技術者試験の学習方法とおすすめの参考書',
                        category: '資格取得',
                        question: '今期中に基本情報技術者試験の合格を目指しています。効率的な勉強手順を教えてください。',
                        answer: 'まずは過去問道場などのWebサイトで過去問を繰り返し解き、苦手分野を教科書で補完するのが一番の近道です。',
                        teacher: '佐藤先生',
                        date: '2026-10-12',
                        likes: 8
                    }
                ];
                localStorage.setItem('trs_data_qas', JSON.stringify(qas));
            }
        };

        initDefaultData();

        window.firebaseAuthReady = new Promise((resolve) => {
            if (isFirebaseAvailable && auth) {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token)
                        .then(resolve)
                        .catch(() => signInAnonymously(auth).then(resolve).catch(resolve));
                } else {
                    signInAnonymously(auth).then(resolve).catch(resolve);
                }
            } else {
                resolve();
            }
        });

        window.dbServices = {
            subscribe: (colName, callback) => {
                let unsubFirestore = null;
                
                if (!localListeners[colName]) localListeners[colName] = [];
                localListeners[colName].push(callback);

                const currentData = JSON.parse(localStorage.getItem(`trs_data_${colName}`) || '[]');
                callback(currentData);

                if (isFirebaseAvailable && db) {
                    try {
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                        unsubFirestore = onSnapshot(colRef, (snapshot) => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            localStorage.setItem(`trs_data_${colName}`, JSON.stringify(data));
                            callback(data);
                        }, (err) => {
                            console.warn(`[Firestore Sync Warning] ${colName}:`, err);
                        });
                    } catch(e) {
                        console.warn('Firestore subscription fallback applied:', e);
                    }
                }

                return () => {
                    if (unsubFirestore) unsubFirestore();
                    if (localListeners[colName]) {
                        localListeners[colName] = localListeners[colName].filter(cb => cb !== callback);
                    }
                };
            },
            set: async (colName, docId, data) => {
                const localData = JSON.parse(localStorage.getItem(`trs_data_${colName}`) || '[]');
                const index = localData.findIndex(item => item.id === docId);
                if (index >= 0) localData[index] = { ...localData[index], ...data };
                else localData.push({ id: docId, ...data });
                localStorage.setItem(`trs_data_${colName}`, JSON.stringify(localData));

                triggerLocalUpdate(colName);

                if (syncChannel) {
                    try { syncChannel.postMessage({ colName, action: 'set', docId }); } catch(err) {}
                }

                if (isFirebaseAvailable && db) {
                    Promise.resolve().then(async () => {
                        try {
                            if (window.firebaseAuthReady) await window.firebaseAuthReady;
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
                            await setDoc(docRef, data, { merge: true });
                        } catch(e) {
                            console.warn('Firestore set async fallback:', e);
                        }
                    });
                }
            },
            add: async (colName, data) => {
                const newId = `${colName}_${Date.now()}`;
                await window.dbServices.set(colName, newId, { id: newId, ...data });
                return newId;
            },
            update: async (colName, docId, data) => {
                await window.dbServices.set(colName, docId, data);
            },
            delete: async (colName, docId) => {
                const localData = JSON.parse(localStorage.getItem(`trs_data_${colName}`) || '[]');
                const filtered = localData.filter(item => item.id !== docId);
                localStorage.setItem(`trs_data_${colName}`, JSON.stringify(filtered));

                triggerLocalUpdate(colName);

                if (syncChannel) {
                    try { syncChannel.postMessage({ colName, action: 'delete', docId }); } catch(err) {}
                }

                if (isFirebaseAvailable && db) {
                    Promise.resolve().then(async () => {
                        try {
                            if (window.firebaseAuthReady) await window.firebaseAuthReady;
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
                            await deleteDoc(docRef);
                        } catch(e) {
                            console.warn('Firestore delete async fallback:', e);
                        }
                    });
                }
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const generateGoogleCalendarUrl = (title, date, time, details) => {
            try {
                const [startTimeStr, endTimeStr] = time.split(" - ");
                const startDate = new Date(`${date}T${startTimeStr}:00`);
                const endDate = new Date(`${date}T${endTimeStr}:00`);
                
                const format = (d) => {
                    const pad = (n) => n.toString().padStart(2, '0');
                    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
                };
                
                const baseUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE";
                const text = encodeURIComponent(title);
                const dates = `${format(startDate)}/${format(endDate)}`;
                const detailsEncoded = encodeURIComponent(details || "詳細なし");
                
                return `${baseUrl}&text=${text}&dates=${dates}&details=${detailsEncoded}`;
            } catch (e) {
                return "#";
            }
        };

        const Badge = ({ children, color = "blue" }) => {
            const colors = {
                blue: "bg-blue-100 text-blue-800",
                green: "bg-emerald-100 text-emerald-800",
                yellow: "bg-amber-100 text-amber-800",
                gray: "bg-slate-100 text-slate-800",
                purple: "bg-purple-100 text-purple-800",
                amber: "bg-amber-100 text-amber-800",
                red: "bg-red-100 text-red-800"
            };
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${colors[color] || colors.blue}`}>
                    {children}
                </span>
            );
        };

        const Button = ({ children, onClick, variant = "primary", className = "", disabled = false, type = "button" }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 active:scale-95";
            const variants = {
                primary: "bg-primary text-white hover:bg-primaryHover disabled:bg-indigo-300 shadow-sm",
                outline: "border-2 border-primary text-primary hover:bg-indigo-50 disabled:border-indigo-300 disabled:text-indigo-300",
                danger: "bg-red-500 text-white hover:bg-red-600 disabled:bg-red-300 shadow-sm",
                ghost: "text-slate-600 hover:bg-slate-100 disabled:text-slate-400"
            };
            return (
                <button 
                    type={type}
                    onClick={onClick} 
                    disabled={disabled}
                    className={`${baseStyle} ${variants[variant]} ${className} ${disabled ? 'cursor-not-allowed active:scale-100' : ''}`}
                >
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 fade-in p-4">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                        <div className="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <i className="ph ph-x text-xl"></i>
                            </button>
                        </div>
                        <div className="p-6">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const MyPageView = ({ currentUser, reservations, questions, onDeleteReservation, onDeleteQuestion, onRequireLogin }) => {
            const [activeSubTab, setActiveSubTab] = useState("reservations");

            if (!currentUser) {
                return (
                    <div className="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <i className="ph ph-user-circle text-6xl text-slate-300 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">ログインが必要です</h2>
                        <p className="text-slate-500 max-w-md mx-auto mb-6 text-sm">
                            自分の予約履歴や質問履歴を確認するには、右上の「ログイン / 登録」ボタンからお名前を入力してください。
                        </p>
                        <Button variant="primary" className="mx-auto" onClick={onRequireLogin}>
                            ログイン / アカウント作成
                        </Button>
                    </div>
                );
            }

            const myReservations = reservations.filter(r => r.studentEmail === currentUser.email || r.studentId === currentUser.id || r.student === currentUser.name);
            const myQuestions = questions.filter(q => q.studentEmail === currentUser.email || q.studentId === currentUser.id || q.student === currentUser.name);

            return (
                <div className="fade-in space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center gap-4">
                        <div className="w-16 h-16 rounded-full bg-indigo-100 text-primary font-bold text-2xl flex items-center justify-center border-2 border-primary">
                            {currentUser.name.charAt(0)}
                        </div>
                        <div className="text-center sm:text-left flex-1">
                            <div className="flex items-center justify-center sm:justify-start gap-2">
                                <h2 className="text-xl font-bold text-slate-800">{currentUser.name}</h2>
                                <Badge color="purple">学生アカウント</Badge>
                            </div>
                            <p className="text-slate-500 text-sm">{currentUser.email || "メール未登録"}</p>
                        </div>
                        <div className="flex gap-4 text-center border-t sm:border-t-0 sm:border-l border-slate-100 pt-3 sm:pt-0 sm:pl-6">
                            <div>
                                <span className="block text-2xl font-black text-primary">{myReservations.length}</span>
                                <span className="text-xs text-slate-400 font-medium">面談予約</span>
                            </div>
                            <div>
                                <span className="block text-2xl font-black text-primary">{myQuestions.length}</span>
                                <span className="text-xs text-slate-400 font-medium">質問件数</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex border-b border-slate-200">
                        <button 
                            onClick={() => setActiveSubTab("reservations")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 ${activeSubTab === "reservations" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700"}`}
                        >
                            <i className="ph ph-calendar text-lg"></i> 自分の面談予約 ({myReservations.length})
                        </button>
                        <button 
                            onClick={() => setActiveSubTab("questions")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 ${activeSubTab === "questions" ? "border-transparent text-slate-500 hover:text-slate-700" : "border-primary text-primary"}`}
                        >
                            <i className="ph ph-chat-teardrop-text text-lg"></i> 自分の質問履歴 ({myQuestions.length})
                        </button>
                    </div>

                    {activeSubTab === "reservations" && (
                        <div className="space-y-4">
                            {myReservations.length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
                                    まだ面談の予約はありません。「先生に質問・予約する」タブから予約が行えます。
                                </div>
                            ) : (
                                myReservations.map(res => (
                                    <div key={res.id} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div className="space-y-2 flex-1">
                                            <div className="flex items-center gap-2">
                                                {res.status === 'pending' && <Badge color="yellow">承認待ち</Badge>}
                                                {res.status === 'approved' && <Badge color="green">予約確定 (承認済み)</Badge>}
                                                {res.status === 'completed' && <Badge color="gray">面談終了</Badge>}
                                                <span className="font-bold text-slate-800 text-sm flex items-center gap-1">
                                                    <i className="ph ph-user"></i> 担当: {res.teacher}
                                                </span>
                                            </div>
                                            <div className="text-slate-700 text-sm flex items-center gap-3 font-medium">
                                                <span className="flex items-center gap-1"><i className="ph ph-calendar-blank text-primary"></i> 日時: {res.datetime}</span>
                                            </div>
                                            <div className="bg-slate-50 p-3 rounded-lg text-xs text-slate-600 border border-slate-100 whitespace-pre-wrap">
                                                <strong>事前相談内容:</strong> {res.topic}
                                            </div>
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto shrink-0 justify-end">
                                            {res.status === 'approved' && (
                                                <a 
                                                    href={generateGoogleCalendarUrl(`面談: ${res.teacher}`, res.datetime.split(' ')[0], res.reservedTime || "10:00 - 11:00", res.topic)}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="px-3 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center gap-1.5 border border-[#4285F4] text-[#4285F4] hover:bg-blue-50 text-xs"
                                                >
                                                    <i className="ph ph-calendar text-base"></i> Googleカレンダーと同期
                                                </a>
                                            )}
                                            <Button variant="danger" className="text-xs py-2 px-3" onClick={() => onDeleteReservation(res.id)}>
                                                <i className="ph ph-trash"></i> 予約取消
                                            </Button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    {activeSubTab === "questions" && (
                        <div className="space-y-4">
                            {myQuestions.length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
                                    まだ送信した質問はありません。
                                </div>
                            ) : (
                                myQuestions.map(q => (
                                    <div key={q.id} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-3">
                                        <div className="flex justify-between items-start gap-4">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    {q.status === 'pending' ? <Badge color="yellow">先生の回答待ち</Badge> : <Badge color="green">回答済み (Q&A掲載中)</Badge>}
                                                    <Badge color="blue">{q.category}</Badge>
                                                    <span className="text-xs text-slate-400"><i className="ph ph-clock"></i> {q.date}</span>
                                                </div>
                                                <h3 className="font-bold text-slate-800 text-base">{q.title}</h3>
                                                <p className="text-xs text-slate-500">質問先: {q.teacher}</p>
                                            </div>
                                            <Button variant="ghost" className="text-red-500 hover:bg-red-50 text-xs py-1 px-2" onClick={() => onDeleteQuestion(q.id)}>
                                                <i className="ph ph-trash"></i> 削除
                                            </Button>
                                        </div>

                                        <div className="bg-slate-50 p-3 rounded-lg text-sm text-slate-700 whitespace-pre-wrap border border-slate-100">
                                            {q.question}
                                        </div>

                                        {q.status === 'answered' && (
                                            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-slate-800 text-sm space-y-1">
                                                <p className="font-bold text-emerald-800 flex items-center gap-1.5 text-xs">
                                                    <i className="ph-fill ph-check-circle text-emerald-600 text-base"></i> {q.teacher}からの回答
                                                </p>
                                                <p className="whitespace-pre-wrap text-slate-700">{q.answer}</p>
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const QAView = ({ qas, onLike, likedQaIds }) => {
            const [searchTerm, setSearchTerm] = useState("");
            
            const filteredQas = useMemo(() => {
                let result = qas;
                if (searchTerm.trim()) {
                    const lowerSearch = searchTerm.toLowerCase();
                    result = result.filter(qa => 
                        qa.title?.toLowerCase().includes(lowerSearch) || 
                        qa.question?.toLowerCase().includes(lowerSearch) ||
                        qa.answer?.toLowerCase().includes(lowerSearch) ||
                        qa.category?.toLowerCase().includes(lowerSearch) ||
                        qa.teacher?.toLowerCase().includes(lowerSearch)
                    );
                }
                return [...result].sort((a, b) => (b.likes || 0) - (a.likes || 0));
            }, [qas, searchTerm]);

            return (
                <div className="fade-in">
                    <div className="bg-gradient-to-r from-primary to-indigo-700 text-white p-8 rounded-2xl shadow-lg mb-8 relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-3xl font-black mb-2 tracking-tight">Q&A ナレッジベース</h2>
                            <p className="text-indigo-100 mb-6 max-w-xl">過去の質問や回答、先生の名前で検索して、自己解決に役立てましょう。</p>
                            <div className="relative max-w-2xl">
                                <input 
                                    type="text" 
                                    placeholder="キーワードや先生の名前で検索 (例: 授業, 資格, 山田先生)" 
                                    className="w-full pl-12 pr-4 py-3.5 rounded-xl text-slate-800 focus:outline-none focus:ring-4 focus:ring-secondary/50 shadow-md text-base"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                                <i className="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-2xl"></i>
                            </div>
                        </div>
                        <i className="ph ph-books absolute -right-4 -bottom-10 text-9xl text-white opacity-10"></i>
                    </div>

                    <div className="space-y-4">
                        {filteredQas.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-xl shadow-sm border border-slate-200">
                                <i className="ph ph-ghost text-5xl text-slate-300 mb-4"></i>
                                <h3 className="text-xl font-bold text-slate-700">該当する質問が見つかりませんでした</h3>
                                <p className="text-slate-500 mt-2">キーワードや先生の名前を変更して検索してみてください。</p>
                            </div>
                        ) : (
                            filteredQas.map(qa => (
                                <div key={qa.id} className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start gap-4 mb-3">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-2">
                                                <Badge color="blue">{qa.category}</Badge>
                                                <span className="text-xs text-slate-500 flex items-center gap-1"><i className="ph ph-clock"></i> {qa.date}</span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 leading-tight">{qa.title}</h3>
                                        </div>
                                        <button 
                                            onClick={() => onLike(qa.id)}
                                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border font-medium text-sm transition-all active:scale-95 ${
                                                likedQaIds.includes(qa.id) 
                                                ? "bg-blue-500 text-white border-blue-500 shadow-inner" 
                                                : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200"
                                            }`}
                                            title={likedQaIds.includes(qa.id) ? "いいねを取り消す" : "役に立った！"}
                                        >
                                            <i className={likedQaIds.includes(qa.id) ? "ph-fill ph-thumbs-up" : "ph ph-thumbs-up"}></i> 
                                            <span>{qa.likes || 0}</span>
                                        </button>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-xl text-slate-700 text-sm mb-3 border border-slate-100 whitespace-pre-wrap">
                                        <span className="font-bold text-slate-500 block text-xs mb-1">質問内容:</span>
                                        {qa.question}
                                    </div>
                                    <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-slate-800 text-sm">
                                        <p className="font-bold text-emerald-800 flex items-center gap-1.5 text-xs mb-1">
                                            <i className="ph-fill ph-check-circle text-emerald-600 text-base"></i> {qa.teacher}からの回答
                                        </p>
                                        <p className="whitespace-pre-wrap">{qa.answer}</p>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const ReservationView = ({ onReserve, onAskQuestion, teachers, slots, currentUser, onRequireLogin }) => {
            const [mode, setMode] = useState("reserve");
            const [selectedTeacher, setSelectedTeacher] = useState("all");
            const [selectedSlot, setSelectedSlot] = useState(null);
            
            const [topic, setTopic] = useState("");
            const [resStartTime, setResStartTime] = useState("");
            const [resEndTime, setResEndTime] = useState("");
            const [timeError, setTimeError] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const teacherNames = teachers.map(t => t.name || t);
            const [qTeacher, setQTeacher] = useState(teacherNames[0] || "");
            const [qCategory, setQCategory] = useState("未分類");
            const [qTitle, setQTitle] = useState("");
            const [qQuestion, setQQuestion] = useState("");

            useEffect(() => {
                if (teacherNames.length > 0 && (!qTeacher || !teacherNames.includes(qTeacher))) {
                    setQTeacher(teacherNames[0]);
                }
            }, [teachers, qTeacher]);

            const filterTeachers = ["all", ...teacherNames];

            const filteredSlots = useMemo(() => {
                return slots.filter(slot => {
                    const matchTeacher = selectedTeacher === "all" || slot.teacher === selectedTeacher;
                    return matchTeacher && slot.available;
                });
            }, [slots, selectedTeacher]);

            const handleSlotClick = (slot) => {
                if (!currentUser) {
                    onRequireLogin();
                    return;
                }
                setSelectedSlot(slot);
                const [start, end] = (slot.time || "10:00 - 11:00").split(" - ");
                setResStartTime(start || "10:00");
                setResEndTime(end || "11:00");
                setTimeError("");
                setIsModalOpen(true);
            };

            const handleSubmitReserve = async () => {
                if (!currentUser) {
                    onRequireLogin();
                    return;
                }
                if(!topic.trim() || isSubmitting || !selectedSlot) return;

                const [slotStart, slotEnd] = (selectedSlot.time || "00:00 - 23:59").split(" - ");
                
                if (resStartTime < slotStart || resEndTime > slotEnd || resStartTime >= resEndTime) {
                    setTimeError(`先生の対応可能時間（${selectedSlot.time}）の範囲内で有効な時間帯を指定してください。`);
                    return;
                }

                setIsSubmitting(true);
                
                await onReserve({
                    slotId: selectedSlot.id,
                    topic: topic,
                    teacher: selectedSlot.teacher,
                    datetime: `${selectedSlot.date} ${resStartTime} - ${resEndTime}`,
                    reservedTime: `${resStartTime} - ${resEndTime}`
                });
                
                setIsModalOpen(false);
                setTopic("");
                setSelectedSlot(null);
                setIsSubmitting(false);
            };

            const handleSubmitQuestion = async (e) => {
                e.preventDefault();
                if (!currentUser) {
                    onRequireLogin();
                    return;
                }
                if (!qTitle.trim() || !qQuestion.trim() || !qTeacher) return;

                await onAskQuestion({
                    teacher: qTeacher,
                    category: qCategory,
                    title: qTitle,
                    question: qQuestion
                });

                setQTitle("");
                setQQuestion("");
            };

            if (teacherNames.length === 0) {
                return (
                    <div className="text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <i className="ph ph-users-slash text-5xl text-slate-300 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-700 mb-2">先生が登録されていません</h2>
                        <p className="text-slate-500">右上「管理者・先生画面」から先生を追加してください。</p>
                    </div>
                );
            }

            if (!currentUser) {
                return (
                    <div className="fade-in bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center max-w-lg mx-auto my-8">
                        <div className="w-16 h-16 bg-indigo-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
                            <i className="ph ph-user-circle text-3xl"></i>
                        </div>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">ログインが必要です</h2>
                        <p className="text-slate-500 text-sm mb-6 leading-relaxed">
                            先生への面談予約および質問の送信機能を利用するには、お名前の登録（ログイン）が必要です。
                        </p>
                        <Button variant="primary" className="w-full py-3" onClick={onRequireLogin}>
                            お名前を入力してログインする
                        </Button>
                    </div>
                );
            }

            return (
                <div className="fade-in space-y-6">
                    <div className="flex bg-slate-200/70 p-1.5 rounded-xl max-w-md mx-auto">
                        <button 
                            onClick={() => setMode("reserve")}
                            className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${mode === "reserve" ? "bg-white text-primary shadow-sm" : "text-slate-600 hover:text-slate-900"}`}
                        >
                            <i className="ph ph-calendar-plus text-lg"></i> 面談の予約
                        </button>
                        <button 
                            onClick={() => setMode("question")}
                            className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${mode === "question" ? "bg-white text-primary shadow-sm" : "text-slate-600 hover:text-slate-900"}`}
                        >
                            <i className="ph ph-chat-teardrop-text text-lg"></i> テキスト質問を送信
                        </button>
                    </div>

                    {mode === "reserve" ? (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                <i className="ph ph-calendar-plus text-primary text-2xl"></i>
                                先生の空き時間を探して予約
                            </h2>
                            
                            <div className="mb-6">
                                <label className="block text-sm font-medium text-slate-700 mb-2">先生を絞り込む</label>
                                <select
                                    className="w-full md:w-64 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white cursor-pointer text-sm font-bold"
                                    value={selectedTeacher}
                                    onChange={(e) => setSelectedTeacher(e.target.value)}
                                >
                                    {filterTeachers.map(t => (
                                        <option key={t} value={t}>
                                            {t === "all" ? "すべての先生" : t}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {filteredSlots.length === 0 ? (
                                    <div className="col-span-full text-center py-12 text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                        選択した先生の空き枠は現在ありません。
                                    </div>
                                ) : (
                                    filteredSlots.map(slot => (
                                        <div 
                                            key={slot.id} 
                                            onClick={() => handleSlotClick(slot)}
                                            className="border-2 border-slate-100 p-4 rounded-xl hover:border-primary cursor-pointer transition-all group bg-white hover:shadow-md"
                                        >
                                            <div className="flex justify-between items-start mb-2">
                                                <span className="font-bold text-slate-800 flex items-center gap-1.5 text-base">
                                                    <i className="ph-fill ph-user-circle text-primary text-xl"></i>
                                                    {slot.teacher}
                                                </span>
                                                <Badge color="green">予約可</Badge>
                                            </div>
                                            <div className="text-slate-600 text-sm space-y-1 mt-2">
                                                <p className="flex items-center gap-1.5"><i className="ph ph-calendar text-slate-400"></i> {slot.date}</p>
                                                <p className="flex items-center gap-1.5"><i className="ph ph-clock text-slate-400"></i> {slot.time}</p>
                                            </div>
                                            <div className="mt-3">
                                                <Button variant="outline" className="w-full text-xs py-1.5 group-hover:bg-primary group-hover:text-white">この枠を予約</Button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-2xl mx-auto">
                            <h2 className="text-xl font-bold mb-2 flex items-center gap-2">
                                <i className="ph ph-paper-plane-tilt text-primary text-2xl"></i>
                                先生に直接テキスト質問を送る
                            </h2>
                            <p className="text-slate-500 text-sm mb-6">
                                質問を送信すると先生に届きます。先生が回答すると、Q&Aナレッジベースに掲載されます。
                            </p>

                            <form onSubmit={handleSubmitQuestion} className="space-y-4">
                                <div className="grid md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">質問する先生 <span className="text-red-500">*</span></label>
                                        <select 
                                            className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white text-sm font-bold"
                                            value={qTeacher}
                                            onChange={(e) => setQTeacher(e.target.value)}
                                            required
                                        >
                                            {teacherNames.map((t, idx) => (
                                                <option key={idx} value={t}>{t}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">カテゴリ</label>
                                        <select 
                                            className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white text-sm"
                                            value={qCategory}
                                            onChange={(e) => setQCategory(e.target.value)}
                                        >
                                            <option value="授業">授業</option>
                                            <option value="資格取得">資格取得</option>
                                            <option value="就職活動">就職活動</option>
                                            <option value="進路相談">進路相談</option>
                                            <option value="未分類">未分類</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">質問のタイトル <span className="text-red-500">*</span></label>
                                    <input 
                                        type="text" 
                                        placeholder="例: 期末レポートのテーマ設定について" 
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                        value={qTitle}
                                        onChange={(e) => setQTitle(e.target.value)}
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">質問の詳細内容 <span className="text-red-500">*</span></label>
                                    <textarea 
                                        className="w-full border border-slate-300 rounded-lg p-3 h-36 focus:ring-2 focus:ring-primary outline-none resize-none text-sm"
                                        placeholder="具体的に困っている点や相談したい内容を入力してください"
                                        value={qQuestion}
                                        onChange={(e) => setQQuestion(e.target.value)}
                                        required
                                    ></textarea>
                                </div>

                                <Button type="submit" className="w-full" disabled={!qTitle.trim() || !qQuestion.trim()}>
                                    <i className="ph ph-paper-plane-tilt"></i> 質問を送信する
                                </Button>
                            </form>
                        </div>
                    )}

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="面談予約の確認">
                        {selectedSlot && (
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">担当教員</label>
                                    <div className="w-full px-3 py-2 border border-slate-200 bg-indigo-50/70 rounded-lg text-sm font-bold text-indigo-900 flex items-center gap-2">
                                        <i className="ph-fill ph-user-circle text-primary text-lg"></i>
                                        <span>{selectedSlot.teacher}</span>
                                        <span className="text-xs text-indigo-500 font-normal ml-auto">(担当枠固定)</span>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-3 rounded-lg text-sm text-slate-700 space-y-1 border border-slate-200">
                                    <p><strong>対応枠の日時:</strong> {selectedSlot.date} ({selectedSlot.time})</p>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">希望開始時間 <span className="text-red-500">*</span></label>
                                        <input 
                                            type="time" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                            value={resStartTime}
                                            onChange={(e) => { setResStartTime(e.target.value); setTimeError(""); }}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">希望終了時間 <span className="text-red-500">*</span></label>
                                        <input 
                                            type="time" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                            value={resEndTime}
                                            onChange={(e) => { setResEndTime(e.target.value); setTimeError(""); }}
                                        />
                                    </div>
                                </div>
                                {timeError && <p className="text-red-500 text-xs font-medium">{timeError}</p>}

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">事前相談内容 <span className="text-red-500">*</span></label>
                                    <p className="text-xs text-slate-500 mb-2">何について聞きたいか事前に書いておくとスムーズです。</p>
                                    <textarea 
                                        className="w-full border border-slate-300 rounded-lg p-3 h-28 focus:ring-2 focus:ring-primary outline-none resize-none text-sm"
                                        placeholder="例：進路について個別にアドバイスをいただきたいです。"
                                        value={topic}
                                        onChange={(e) => setTopic(e.target.value)}
                                        disabled={isSubmitting}
                                    ></textarea>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <Button variant="ghost" className="w-full text-sm" onClick={() => setIsModalOpen(false)} disabled={isSubmitting}>キャンセル</Button>
                                    <Button variant="primary" className="w-full text-sm" onClick={handleSubmitReserve} disabled={!topic.trim() || isSubmitting}>
                                        {isSubmitting ? "送信中..." : `${selectedSlot.teacher}へ予約申請`}
                                    </Button>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const TeacherDashboard = ({ reservations, questions, onApprove, onCompleteReservation, onDeleteReservation, onAnswerQuestion, onDeleteQuestion, onUpdateReservationTeacher, teachers, slots }) => {
            const teacherNames = teachers.map(t => t.name || t);
            const [selectedTeacher, setSelectedTeacher] = useState("all");
            const [answerModalTarget, setAnswerModalTarget] = useState(null);
            const [answerText, setAnswerText] = useState("");

            if (teacherNames.length === 0) {
                return (
                    <div className="text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <i className="ph ph-chalkboard-teacher text-5xl text-slate-300 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-700 mb-2">登録されている先生がいません</h2>
                        <p className="text-slate-500">「システム設定」タブから先生を追加してください。</p>
                    </div>
                );
            }

            const myReservations = selectedTeacher === "all" 
                ? reservations 
                : reservations.filter(r => r.teacher === selectedTeacher);
                
            const myQuestions = selectedTeacher === "all" 
                ? (questions || []) 
                : (questions || []).filter(q => q.teacher === selectedTeacher);

            const handleOpenAnswerModal = (q) => {
                setAnswerModalTarget(q);
                setAnswerText("");
            };

            const handleSubmitAnswer = () => {
                if (!answerText.trim() || !answerModalTarget) return;
                onAnswerQuestion(answerModalTarget.id, answerText);
                setAnswerModalTarget(null);
                setAnswerText("");
            };

            return (
                <div className="fade-in space-y-6">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-4 justify-between">
                        <div className="flex items-center gap-3">
                            <label className="font-bold text-slate-700 whitespace-nowrap text-sm">表示切り替え:</label>
                            <select 
                                className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-bold outline-none focus:ring-2 focus:ring-primary bg-white cursor-pointer"
                                value={selectedTeacher}
                                onChange={(e) => setSelectedTeacher(e.target.value)}
                            >
                                <option value="all">🌟 すべての先生の予約・質問を表示</option>
                                {teacherNames.map(t => <option key={t} value={t}>👤 {t}</option>)}
                            </select>
                        </div>
                        <div className="text-xs text-slate-500 font-medium flex items-center gap-3">
                            <span>未承認予約: <strong className="text-amber-600 font-bold">{reservations.filter(r => r.status === 'pending').length}件</strong></span>
                            <span>未回答質問: <strong className="text-amber-600 font-bold">{(questions || []).filter(q => q.status === 'pending').length}件</strong></span>
                        </div>
                    </div>

                    <div className="bg-primary text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold mb-1">先生用ダッシュボード</h2>
                            <p className="text-indigo-100 opacity-90 text-sm">
                                {selectedTeacher === "all" ? "全教員宛ての面談予約・質問を一元管理しています。" : `${selectedTeacher}の専用ダッシュボードです。`}
                            </p>
                        </div>
                        <i className="ph ph-chalkboard-teacher text-5xl opacity-50"></i>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                            <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                                <i className="ph ph-chat-teardrop-text text-primary text-xl"></i> テキスト質問リクエスト
                            </h3>
                            <Badge color="amber">{myQuestions.filter(q => q.status === 'pending').length}件の未回答</Badge>
                        </div>
                        
                        <div className="divide-y divide-slate-100">
                            {myQuestions.length === 0 ? (
                                <div className="p-8 text-center text-slate-500 text-sm">該当するテキスト質問はありません。</div>
                            ) : (
                                myQuestions.map(q => (
                                    <div key={q.id} className="p-6 hover:bg-slate-50 transition-colors flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                                        <div className="space-y-2 flex-1">
                                            <div className="flex flex-wrap items-center gap-2">
                                                {q.status === 'pending' ? <Badge color="yellow">未回答</Badge> : <Badge color="green">回答済み (Q&A公開中)</Badge>}
                                                <Badge color="blue">{q.category}</Badge>
                                                <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">宛先: {q.teacher}</span>
                                                <span className="text-xs text-slate-400"><i className="ph ph-clock"></i> {q.date}</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-xs font-bold text-indigo-900 bg-indigo-50/50 px-3 py-1.5 rounded-lg w-fit">
                                                <i className="ph-fill ph-user-circle text-base text-primary"></i>
                                                <span>質問者: {q.student || '不明'} {q.studentEmail ? `(${q.studentEmail})` : ''}</span>
                                            </div>
                                            <h4 className="font-bold text-slate-800 text-base">{q.title}</h4>
                                            <p className="text-sm text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-200 whitespace-pre-wrap">{q.question}</p>
                                            {q.status === 'answered' && (
                                                <div className="text-sm bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-slate-700 mt-2">
                                                    <strong>回答:</strong> {q.answer}
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="flex gap-2 w-full md:w-auto mt-4 md:mt-0 shrink-0">
                                            {q.status === 'pending' && (
                                                <Button variant="primary" className="text-sm" onClick={() => handleOpenAnswerModal(q)}>

                                                    {res.topic}

                                                            rel="noopener noreferrer"
                                                            className="flex-1 md:flex-none px-3 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center gap-1.5 border-2 border-[#4285F4] text-[#4285F4] hover:bg-blue-50 text-xs"

                                                        </a>
                                                        <Button variant="outline" className="flex-1 md:flex-none text-sm" onClick={() => onCompleteReservation(res.id)}>
                                                            <i className="ph ph-check-circle"></i> 完了にする
                                                        </Button>
                                                    </>

                                                <Button variant="danger" className="flex-1 md:flex-none text-sm" onClick={() => onDeleteReservation(res.id)}>
                                                    <i className="ph ph-trash"></i> 削除
                                                </Button>
                                            </div>
                                        </div>

                                })

        const AdminView = ({ onAddTeacher, onDeleteTeacher, onAddSlot, onUpdateSlot, onDeleteSlot, teachers, slots, reservations, questions, qas, onDeleteQa, onDeleteQuestion, onApprove, onCompleteReservation, onDeleteReservation, onAnswerQuestion, onUpdateReservationTeacher, onShowToast }) => {
            const [password, setPassword] = useState("");
            const [isAuth, setIsAuth] = useState(false);
            const [error, setError] = useState("");
            const [newTeacherName, setNewTeacherName] = useState("");
            const [activeAdminTab, setActiveAdminTab] = useState("system");

                tomorrow.setDate(tomorrow.getDate() + 1);
                return tomorrow.toISOString().split('T')[0];
            });
            const [slotStartTime, setSlotStartTime] = useState("10:00");
            const [slotEndTime, setSlotEndTime] = useState("11:00");

            const [editingSlot, setEditingSlot] = useState(null);
            const [editTeacher, setEditTeacher] = useState("");
            const [editDate, setEditDate] = useState("");
            const [editStartTime, setEditStartTime] = useState("");
            const [editEndTime, setEditEndTime] = useState("");
            const [editAvailable, setEditAvailable] = useState(true);

            useEffect(() => {
                if (teacherNames.length > 0) {
                    if (!slotTeacher || !teacherNames.includes(slotTeacher)) {
                        setSlotTeacher(teacherNames[0]);
                    }
                }
            }, [teachers]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === "BIT3150" || password === "admin") {
                    setIsAuth(true);
                    setError("");
                } else {
                    setError("パスワードが違います (デフォルト: BIT3150 または admin)");
                }
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (newTeacherName.trim()) {
                    const addedName = newTeacherName.trim();
                    await onAddTeacher(addedName);
                    setNewTeacherName("");
                    setSlotTeacher(addedName);
                }
            };

            const handleAddSlotSubmit = (e) => {
                e.preventDefault();
                if (slotStartTime >= slotEndTime) {
                    if (onShowToast) onShowToast("終了時間は開始時間より後の時刻を指定してください");
                    return;
                }
                if (slotTeacher && slotDate && slotStartTime && slotEndTime) {
                    onAddSlot(slotTeacher, slotDate, `${slotStartTime} - ${slotEndTime}`);
                }
            };

            const handleOpenEditSlot = (slot) => {
                setEditingSlot(slot);
                setEditTeacher(slot.teacher || teacherNames[0] || "");
                setEditDate(slot.date || "");
                const times = (slot.time || "10:00 - 11:00").split(" - ");
                setEditStartTime(times[0] || "10:00");
                setEditEndTime(times[1] || "11:00");
                setEditAvailable(slot.available !== false);
            };

            const handleSaveEditedSlot = () => {
                if (!editingSlot) return;
                if (editStartTime >= editEndTime) {
                    if (onShowToast) onShowToast("終了時間は開始時間より後の時刻を指定してください");
                    return;
                }

                onUpdateSlot(editingSlot.id, {
                    teacher: editTeacher,
                    date: editDate,
                    time: `${editStartTime} - ${editEndTime}`,
                    available: editAvailable
                });

                setEditingSlot(null);
            };

            if (!isAuth) {

                                <div className="bg-indigo-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-primary">
                                    <i className="ph ph-lock-key text-3xl"></i>
                                </div>
                                <h2 className="text-xl font-bold text-slate-800">管理者・教員ログイン</h2>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">

                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                    />
                                    {error && <p className="text-red-500 text-xs mt-1.5">{error}</p>}
                                </div>
                                <Button type="submit" className="w-full">ログイン</Button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (

                            onClick={() => setActiveAdminTab("system")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeAdminTab === "system" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700"}`}
                        >

                            onClick={() => setActiveAdminTab("teacher")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeAdminTab === "teacher" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700"}`}
                        >
                            <i className="ph ph-chalkboard-teacher text-lg"></i> 先生ビュー (予約の確認・承認)
                        </button>
                        <button
                            onClick={() => setActiveAdminTab("all_reservations")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeAdminTab === "all_reservations" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700"}`}
                        >
                            <i className="ph ph-list-checks text-lg"></i> 全面談予約の一括変更
                        </button>
                        <button
                            onClick={() => setActiveAdminTab("qa")}
                            className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeAdminTab === "qa" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700"}`}
                        >
                            <i className="ph ph-books text-lg"></i> Q&A管理
                        </button>
                    </div>

                    <div className={activeAdminTab === "system" ? "block space-y-6" : "hidden"}>

                                <h2 className="text-2xl font-bold mb-1">システム管理</h2>
                                <p className="text-slate-300 text-sm">先生のアカウント（名前）や面談可能時間の登録・変更が行えます。</p>
                            </div>
                            <i className="ph ph-gear text-5xl opacity-40"></i>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">

                                <form onSubmit={handleAdd} className="space-y-4">

                                    <p className="text-slate-500 text-sm text-center py-6 border-2 border-dashed border-slate-200 rounded-lg">

                                    <ul className="divide-y divide-slate-100 max-h-48 overflow-y-auto pr-1">

                                            const tId = teacher.id || name;

                                                        <i className="ph ph-trash text-base"></i>
                                                    </button>
                                                </li>

                                )}

                                                onChange={(e) => setSlotTeacher(e.target.value)}
                                                required

                                                value={slotStartTime}
                                                onChange={(e) => setSlotStartTime(e.target.value)}

                                            <label className="block text-sm font-medium text-slate-700 mb-1">終了時間</label>

                                                value={slotEndTime}
                                                onChange={(e) => setSlotEndTime(e.target.value)}

                                                    <th className="px-4 py-3">ステータス</th>
                                                    <th className="px-4 py-3 text-right">操作</th>

                                            <tbody className="divide-y divide-slate-100 bg-white">

                                                        <td className="px-4 py-3 font-semibold text-slate-800">{s.teacher}</td>
                                                        <td className="px-4 py-3 whitespace-nowrap">{s.date}</td>
                                                        <td className="px-4 py-3 font-mono font-medium whitespace-nowrap">{s.time}</td>
                                                        <td className="px-4 py-3">
                                                            {s.available ? (
                                                                <Badge color="green">予約可</Badge>

                                                                <Badge color="gray">予約済 / 停止</Badge>
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-3 text-right whitespace-nowrap">
                                                            <div className="flex items-center justify-end gap-2">
                                                                <button
                                                                    onClick={() => handleOpenEditSlot(s)}
                                                                    className="px-2.5 py-1 text-xs font-bold bg-indigo-50 text-primary hover:bg-primary hover:text-white rounded-lg transition-colors flex items-center gap-1"
                                                                    title="担当先生・日時・時間を変更"
                                                                >
                                                                    <i className="ph ph-pencil-simple text-sm"></i> 変更
                                                                </button>
                                                                <button
                                                                    onClick={() => onDeleteSlot(s.id)}
                                                                    className="px-2 py-1 text-xs text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                                                                    title="この空き枠を削除"
                                                                >
                                                                    <i className="ph ph-trash text-sm"></i> 削除
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className={activeAdminTab === "teacher" ? "block" : "hidden"}>
                        <TeacherDashboard 
                            reservations={reservations} 
                            questions={questions}
                            onApprove={onApprove} 
                            onCompleteReservation={onCompleteReservation} 
                            onDeleteReservation={onDeleteReservation}
                            onAnswerQuestion={onAnswerQuestion}
                            onDeleteQuestion={onDeleteQuestion}
                            onUpdateReservationTeacher={onUpdateReservationTeacher}
                            teachers={teachers} 
                            slots={slots} 
                        />
                    </div>

                    <div className={activeAdminTab === "all_reservations" ? "block space-y-6" : "hidden"}>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">

                                <i className="ph ph-arrows-clockwise text-primary text-xl"></i> 全面談予約の担当教員一覧・即時変更
                            </h3>
                            <p className="text-slate-500 text-sm mb-6">
                                登録されたすべての予約データを一覧表示しています。担当教員の変更は以下のドロップダウンから即時適用できます。
                            </p>

                            {reservations.length === 0 ? (
                                <p className="text-slate-400 text-sm text-center py-8 border border-dashed border-slate-200 rounded-xl">
                                    現在登録されている予約はありません。
