                                <div className="space-y-4">
                                    {reservations.map(res => (
                                        <div key={res.id} className="p-4 border border-slate-200 rounded-xl bg-white shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div className="space-y-1.5 flex-1">
                                                <div className="flex flex-wrap items-center gap-2">
                                                    <span className="font-bold text-slate-800 text-sm">予約者: {res.student}</span>
                                                    {res.status === 'pending' && <Badge color="yellow">承認待ち</Badge>}
                                                    {res.status === 'approved' && <Badge color="green">承認済み</Badge>}
                                                    {res.status === 'completed' && <Badge color="gray">面談完了</Badge>}
                                                </div>
                                                <p className="text-xs text-slate-500"><i className="ph ph-calendar"></i> 日時: {res.datetime}</p>
                                                <p className="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100">内容: {res.topic}</p>
                                            </div>

                                            <div className="flex items-center gap-3 shrink-0 bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
                                                <label className="text-xs font-bold text-indigo-900 whitespace-nowrap">担当教員を変更:</label>
                                                <select
                                                    value={res.teacher}
                                                    onChange={(e) => onUpdateReservationTeacher(res.id, e.target.value)}
                                                    className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-bold bg-white focus:ring-2 focus:ring-primary outline-none cursor-pointer"
                                                >
                                                    {teacherNames.map(t => (
                                                        <option key={t} value={t}>{t}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {activeAdminTab === "qa" && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2">
                                <i className="ph ph-books text-primary text-xl"></i> Q&Aナレッジベース管理
                            </h3>
                            {qas.length === 0 ? (
                                <p className="text-slate-500 text-sm py-8 text-center border-2 border-dashed border-slate-200 rounded-xl">
                                    Q&Aナレッジベースに登録されているデータはありません。
                                </p>
                            ) : (
                                <div className="space-y-4">
                                    {qas.map(qa => (
                                        <div key={qa.id} className="p-4 border border-slate-200 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-300">
                                            <div className="space-y-1 flex-1">
                                                <div className="flex items-center gap-2">
                                                    <Badge color="blue">{qa.category}</Badge>
                                                    <span className="text-xs text-slate-400">{qa.date} - 担当: {qa.teacher}</span>
                                                </div>
                                                <h4 className="font-bold text-slate-800 text-sm">{qa.title}</h4>
                                                <p className="text-xs text-slate-600 line-clamp-2">{qa.question}</p>
                                            </div>
                                            <Button variant="danger" className="text-xs py-1.5 px-3 shrink-0" onClick={() => onDeleteQa(qa.id)}>
                                                <i className="ph ph-trash"></i> Q&Aから削除
                                            </Button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    <Modal isOpen={!!editingSlot} onClose={() => setEditingSlot(null)} title="空き時間の変更">
                        {editingSlot && (
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">対象の先生 <span className="text-red-500">*</span></label>
                                    <select 
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white text-sm font-bold"
                                        value={editTeacher}
                                        onChange={(e) => setEditTeacher(e.target.value)}
                                    >
                                        {teacherNames.map((t, idx) => (
                                            <option key={idx} value={t}>{t}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">日付 <span className="text-red-500">*</span></label>
                                    <input 
                                        type="date" 
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                        value={editDate}
                                        onChange={(e) => setEditDate(e.target.value)}
                                        required
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">開始時間 <span className="text-red-500">*</span></label>
                                        <input 
                                            type="time" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                            value={editStartTime}
                                            onChange={(e) => setEditStartTime(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">終了時間 <span className="text-red-500">*</span></label>
                                        <input 
                                            type="time" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                            value={editEndTime}
                                            onChange={(e) => setEditEndTime(e.target.value)}
                                            required
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">予約可否ステータス</label>
                                    <div className="flex items-center gap-4 mt-1">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                                            <input 
                                                type="radio" 
                                                name="slotStatus"
                                                checked={editAvailable === true}
                                                onChange={() => setEditAvailable(true)}
                                                className="text-primary focus:ring-primary"
                                            />
                                            <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">予約可能</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                                            <input 
                                                type="radio" 
                                                name="slotStatus"
                                                checked={editAvailable === false}
                                                onChange={() => setEditAvailable(false)}
                                                className="text-primary focus:ring-primary"
                                            />
                                            <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold">予約停止 / 予約済</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-3 border-t border-slate-100">
                                    <Button variant="ghost" className="w-full text-sm" onClick={() => setEditingSlot(null)}>キャンセル</Button>
                                    <Button variant="primary" className="w-full text-sm" onClick={handleSaveEditedSlot}>
                                        <i className="ph ph-check-bold"></i> 変更内容を保存
                                    </Button>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState("qa");
            const [role, setRole] = useState("student");
            
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = localStorage.getItem('trs_user');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) { return null; }
            });

            const [loginName, setLoginName] = useState("");
            const [loginEmail, setLoginEmail] = useState("");
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);

            const [teachers, setTeachers] = useState([]);
            const [slots, setSlots] = useState([]);
            const [reservations, setReservations] = useState([]);
            const [questions, setQuestions] = useState([]);
            const [qas, setQas] = useState([]);

            const [likedQaIds, setLikedQaIds] = useState(() => {
                try {
                    const saved = localStorage.getItem('trs_liked_qas');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('trs_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('trs_user');
                }
            }, [currentUser]);

            useEffect(() => {
                localStorage.setItem('trs_liked_qas', JSON.stringify(likedQaIds));
            }, [likedQaIds]);

            useEffect(() => {
                let unsubs = [];
                const setupDataSync = () => {
                    if (window.dbServices) {
                        const unsubTeachers = window.dbServices.subscribe('teachers', (data) => setTeachers(data));
                        const unsubSlots = window.dbServices.subscribe('slots', (data) => setSlots(data));
                        const unsubRes = window.dbServices.subscribe('reservations', (data) => setReservations(data));
                        const unsubQ = window.dbServices.subscribe('questions', (data) => setQuestions(data));
                        const unsubQa = window.dbServices.subscribe('qas', (data) => setQas(data));

                        unsubs = [unsubTeachers, unsubSlots, unsubRes, unsubQ, unsubQa];
                    }
                };

                setupDataSync();

                return () => {
                    unsubs.forEach(unsub => unsub && unsub());
                };
            }, []);

            const handleSimpleLogin = (e) => {
                e.preventDefault();
                if (!loginName.trim()) return;

                const user = {
                    id: currentUser?.id || `user_${Date.now()}`,
                    name: loginName.trim(),
                    email: loginEmail.trim() || `${loginName.trim()}@student.local`
                };

                setCurrentUser(user);
                setIsLoginModalOpen(false);
                showToast(`${user.name}さんとしてログインしました`);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setLoginName("");
                setLoginEmail("");
                showToast("ログアウトしました");
            };

            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleLike = async (id) => {
                if (!currentUser) {
                    showToast("Q&Aへの「いいね」にはログインが必要です");
                    setIsLoginModalOpen(true);
                    return;
                }
                const targetQa = qas.find(q => q.id === id);
                if (!targetQa) return;

                if (likedQaIds.includes(id)) {
                    setLikedQaIds(likedQaIds.filter(qId => qId !== id));
                    await window.dbServices.update('qas', id, { likes: Math.max(0, (targetQa.likes || 1) - 1) });
                } else {
                    setLikedQaIds([...likedQaIds, id]);
                    await window.dbServices.update('qas', id, { likes: (targetQa.likes || 0) + 1 });
                }
            };

            const handleAddTeacher = async (name) => {
                const existingNames = teachers.map(t => t.name || t);
                if (existingNames.includes(name)) {
                    showToast("その先生は既に登録されています");
                    return;
                }
                const docId = `teacher_${Date.now()}`;
                await window.dbServices.set('teachers', docId, { id: docId, name });
                showToast(`${name}を追加しました。`);
            };

            const handleDeleteTeacher = async (id, name) => {
                await window.dbServices.delete('teachers', id);
                const relatedSlots = slots.filter(s => s.teacher === name);
                for (let s of relatedSlots) {
                    await window.dbServices.delete('slots', s.id);
                }
                showToast(`${name}を削除しました`);
            };

            const handleAddSlot = async (teacher, date, time) => {
                const isDuplicate = slots.some(slot => 
                    slot.teacher === teacher && 
                    slot.date === date && 
                    slot.time === time
                );
                
                if (isDuplicate) {
                    showToast("その日時の空き枠はすでに登録されています");
                    return;
                }

                const docId = `slot_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
                const newSlot = {
                    id: docId,
                    teacher,
                    date,
                    time,
                    available: true
                };
                await window.dbServices.set('slots', docId, newSlot);
                showToast(`${teacher}の空き枠（${date} ${time}）を追加しました。`);
            };

            const handleUpdateSlot = async (slotId, updatedData) => {
                await window.dbServices.update('slots', slotId, updatedData);
                showToast("登録枠の情報を更新しました。");
            };

            const handleUpdateReservationTeacher = async (resId, newTeacher) => {
                await window.dbServices.update('reservations', resId, { teacher: newTeacher });
                showToast(`予約の担当教員を「${newTeacher}」に変更しました。`);
            };

            const handleReserve = async (data) => {
                if (!currentUser) {
                    showToast("予約を行うにはログインが必要です");
                    setIsLoginModalOpen(true);
                    return;
                }

                const targetSlot = slots.find(s => s.id === data.slotId);
                const isAlreadyReserved = reservations.some(r => r.slotId === data.slotId);

                if (isAlreadyReserved || (targetSlot && !targetSlot.available)) {
                    showToast("この枠はすでに予約されています。別の枠を選択してください。");
                    return;
                }

                const resId = `res_${Date.now()}`;
                const newReservation = {
                    id: resId,
                    student: currentUser.name,
                    studentEmail: currentUser.email,
                    studentId: currentUser.id,
                    slotId: data.slotId,
                    teacher: data.teacher,
                    topic: data.topic,
                    datetime: data.datetime,
                    reservedTime: data.reservedTime,
                    status: "pending"
                };

                await window.dbServices.set('reservations', resId, newReservation);

                if (targetSlot) {
                    const [slotStart, slotEnd] = (targetSlot.time || "10:00 - 11:00").split(" - ");
                    const [resStart, resEnd] = (data.reservedTime || "10:00 - 11:00").split(" - ");

                    await window.dbServices.update('slots', data.slotId, { time: data.reservedTime, available: false });

                    if (slotStart && resStart && slotStart < resStart) {
                        const extraSlotId1 = `slot_${Date.now()}_1`;
                        await window.dbServices.set('slots', extraSlotId1, {
                            id: extraSlotId1,
                            teacher: targetSlot.teacher,
                            date: targetSlot.date,
                            time: `${slotStart} - ${resStart}`,
                            available: true
                        });
                    }

                    if (resEnd && slotEnd && resEnd < slotEnd) {
                        const extraSlotId2 = `slot_${Date.now()}_2`;
                        await window.dbServices.set('slots', extraSlotId2, {
                            id: extraSlotId2,
                            teacher: targetSlot.teacher,
                            date: targetSlot.date,
                            time: `${resEnd} - ${slotEnd}`,
                            available: true
                        });
                    }
                }

                showToast(`${data.teacher}へ面談予約を送信しました！ (${data.datetime})`);
            };

            const handleAskQuestion = async (data) => {
                if (!currentUser) {
                    showToast("質問を送信するにはログインが必要です");
                    setIsLoginModalOpen(true);
                    return;
                }
                const qId = `q_${Date.now()}`;
                const newQuestion = {
                    id: qId,
                    student: currentUser.name,
                    studentEmail: currentUser.email,
                    studentId: currentUser.id,
                    teacher: data.teacher,
                    category: data.category || "未分類",
                    title: data.title,
                    question: data.question,
                    status: "pending",
                    date: new Date().toISOString().split('T')[0]
                };
                await window.dbServices.set('questions', qId, newQuestion);
                showToast(`${data.teacher}へテキスト質問を送信しました！`);
            };

            const handleApprove = async (id) => {
                await window.dbServices.update('reservations', id, { status: 'approved' });
                showToast("予約を承認しました。");
            };

            const handleCompleteReservation = async (id) => {
                await window.dbServices.update('reservations', id, { status: 'completed' });
                showToast("面談対応を完了にしました。");
            };

            const handleAnswerQuestion = async (questionId, answerText) => {
                const targetQ = questions.find(q => q.id === questionId);
                if (!targetQ) return;

                await window.dbServices.update('questions', questionId, { status: 'answered', answer: answerText });

                const qaId = `qa_${Date.now()}`;
                const newQa = {
                    id: qaId,
                    category: targetQ.category,
                    title: targetQ.title,
                    question: targetQ.question,
                    answer: answerText,
                    teacher: targetQ.teacher,
                    date: new Date().toISOString().split('T')[0],
                    likes: 0
                };
                await window.dbServices.set('qas', qaId, newQa);
                showToast("質問に回答し、Q&Aナレッジベースに公開しました。");
            };

            const handleDeleteQuestion = async (id) => {
                await window.dbServices.delete('questions', id);
                showToast("質問を削除しました");
            };

            const handleDeleteReservation = async (id) => {
                await window.dbServices.delete('reservations', id);
                showToast("予約を削除しました");
            };

            const handleDeleteSlot = async (id) => {
                await window.dbServices.delete('slots', id);
                showToast("空き時間を削除しました");
            };

            const handleDeleteQa = async (id) => {
                await window.dbServices.delete('qas', id);
                showToast("Q&Aを削除しました");
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {toastMessage && (
                        <div className="fixed top-4 right-4 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-xl z-50 fade-in flex items-center gap-2 text-sm font-medium">
                            <i className="ph-fill ph-check-circle text-secondary text-xl"></i>
                            {toastMessage}
                        </div>
                    )}

                    <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <div className="bg-primary text-white p-2 rounded-xl flex items-center justify-center">
                                    <i className="ph ph-calendar-check text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg sm:text-xl font-black text-slate-800 tracking-tight leading-none">
                                        Teacher Reservation System (TRS)
                                    </h1>
                                    <span className="text-[10px] text-slate-400 font-semibold tracking-wider flex items-center gap-1 mt-0.5">
                                        TEACHER QA & SCHEDULE 
                                        <span className="text-emerald-500">● リアルタイム同期稼働中</span>
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                {currentUser ? (
                                    <div className="flex items-center gap-2 border-r border-slate-200 pr-3">
                                        <div className="w-8 h-8 rounded-full bg-indigo-100 text-primary font-bold flex items-center justify-center text-xs border">
                                            {currentUser.name.charAt(0)}
                                        </div>
                                        <div className="hidden sm:block text-left">
                                            <p className="text-xs font-bold text-slate-800 leading-none">{currentUser.name}</p>
                                            <p className="text-[10px] text-slate-400">{currentUser.email}</p>
                                        </div>
                                        <button 
                                            onClick={handleLogout}
                                            className="text-xs text-slate-500 hover:text-red-500 ml-1 p-1"
                                            title="ログアウト"
                                        >
                                            <i className="ph ph-sign-out text-lg"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => {
                                            setLoginName("");
                                            setLoginEmail("");
                                            setIsLoginModalOpen(true);
                                        }}
                                        className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-primary hover:bg-indigo-50 text-xs sm:text-sm font-medium text-primary shadow-sm transition-all"
                                    >
                                        <i className="ph ph-user-circle text-base"></i>
                                        <span>ログイン / 登録</span>
                                    </button>
                                )}

                                <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                    <button 
                                        onClick={() => { setRole("student"); setActiveTab("qa"); }}
                                        className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all ${role === "student" ? "bg-white shadow-sm text-primary" : "text-slate-500 hover:text-slate-700"}`}
                                    >
                                        学生ビュー
                                    </button>
                                    <button 
                                        onClick={() => { setRole("admin"); setActiveTab("admin"); }}
                                        className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition-all flex items-center gap-1 ${role === "admin" ? "bg-slate-800 shadow-sm text-white" : "text-slate-500 hover:text-slate-700"}`}
                                    >
                                        <i className="ph-fill ph-lock-key"></i> 管理者・先生画面
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
                        {role === "student" && (
                            <div className="flex border-b border-slate-200 mb-8 overflow-x-auto">
                                <button 
                                    onClick={() => setActiveTab("qa")}
                                    className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeTab === "qa" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"}`}
                                >
                                    <i className="ph ph-books text-lg"></i> Q&Aナレッジベース
                                </button>
                                <button 
                                    onClick={() => setActiveTab("reserve")}
                                    className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeTab === "reserve" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"}`}
                                >
                                    <i className="ph ph-calendar-plus text-lg"></i> 先生に質問・予約する
                                </button>
                                <button 
                                    onClick={() => setActiveTab("mypage")}
                                    className={`px-6 py-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${activeTab === "mypage" ? "border-primary text-primary" : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"}`}
                                >
                                    <i className="ph ph-user text-lg"></i> マイページ (自分の予約・履歴)
                                </button>
                            </div>
                        )}

                        {role === "student" && activeTab === "qa" && (
                            <QAView qas={qas} onLike={handleLike} likedQaIds={likedQaIds} />
                        )}

                        {role === "student" && activeTab === "reserve" && (
                            <ReservationView 
                                onReserve={handleReserve}
                                onAskQuestion={handleAskQuestion}
                                teachers={teachers}
                                slots={slots}
                                currentUser={currentUser}
                                onRequireLogin={() => setIsLoginModalOpen(true)}
                            />
                        )}

                        {role === "student" && activeTab === "mypage" && (
                            <MyPageView 
                                currentUser={currentUser}
                                reservations={reservations}
                                questions={questions}
                                onDeleteReservation={handleDeleteReservation}
                                onDeleteQuestion={handleDeleteQuestion}
                                onRequireLogin={() => setIsLoginModalOpen(true)}
                            />
                        )}

                        {role === "admin" && (
                            <AdminView 
                                onAddTeacher={handleAddTeacher}
                                onDeleteTeacher={handleDeleteTeacher}
                                onAddSlot={handleAddSlot}
                                onUpdateSlot={handleUpdateSlot}
                                onDeleteSlot={handleDeleteSlot}
                                teachers={teachers}
                                slots={slots}
                                reservations={reservations}
                                questions={questions}
                                qas={qas}
                                onDeleteQa={handleDeleteQa}
                                onDeleteQuestion={handleDeleteQuestion}
                                onApprove={handleApprove}
                                onCompleteReservation={handleCompleteReservation}
                                onDeleteReservation={handleDeleteReservation}
                                onAnswerQuestion={handleAnswerQuestion}
                                onUpdateReservationTeacher={handleUpdateReservationTeacher}
                                onShowToast={showToast}
                            />
                        )}
                    </main>

                    <Modal isOpen={isLoginModalOpen} onClose={() => setIsLoginModalOpen(false)} title="学生ログイン / お名前の登録">
                        <form onSubmit={handleSimpleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">お名前 (ニックネーム可) <span className="text-red-500">*</span></label>
                                <input 
                                    type="text" 
                                    placeholder="例: 情報太郎" 
                                    className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                    value={loginName}
                                    onChange={(e) => setLoginName(e.target.value)}
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">メールアドレス (任意)</label>
                                <input 
                                    type="email" 
                                    placeholder="予約承認の通知などを受け取る場合" 
                                    className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm"
                                    value={loginEmail}
                                    onChange={(e) => setLoginEmail(e.target.value)}
                                />
                            </div>
                            <Button type="submit" className="w-full py-3 mt-2" disabled={!loginName.trim()}>ログインして機能を使う</Button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
